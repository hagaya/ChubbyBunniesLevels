name: Deploy Chubby Bunnies API to Azure App Service

on:
  push:
    branches: [ main ]
    paths:
      - 'ChubbyBunniesLevels.Api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ChubbyBunniesLevels.Api/ChubbyBunniesLevels.Api.csproj

      - name: Build & publish
        run: |
          dotnet publish ChubbyBunniesLevels.Api/ChubbyBunniesLevels.Api.csproj \
            -c Release \
            -o ./publish \
            --no-restore

      - name: Create deployment zip
        run: cd publish && zip -r ../deploy.zip . -x "*.pdb"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: chubbybunnies-api
          package: deploy.zip
